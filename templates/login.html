<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access | Gate Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-viewport" style="max-width: 380px; padding: 40px 32px;">
        <header style="justify-content: center; margin-bottom: 24px; padding-bottom: 16px;">
            <h1 style="text-align: center;">Operator Authentication <span class="sub-tag">GATE</span></h1>
        </header>

        {% if error %}
        <p
            style="color: var(--sys-red); font-size: 0.85rem; font-weight: 500; text-align: center; margin-bottom: 16px;">
            {{ error }}</p>
        {% endif %}

        <form method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label class="metric-lbl" style="margin-bottom: 6px;">Operator Username</label>
                <input type="text" name="username" required placeholder=""
                    style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-ui); background: var(--bg-app); color: var(--text-main); outline: none; font-size: 0.95rem;">
            </div>
            <div>
                <label class="metric-lbl" style="margin-bottom: 6px;">Password</label>
                <input type="password" name="password" required placeholder=""
                    style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-ui); background: var(--bg-app); color: var(--text-main); outline: none; font-size: 0.95rem;">
            </div>
            <button type="submit"
                style="margin-top: 8px; padding: 12px; border-radius: 6px; border: none; background-color: var(--accent-blue); color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer; box-shadow: var(--shadow-sm);">Submit</button>
        </form>
    </div>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('industrial-theme') || 'light');
    </script>
</body>

</html>
